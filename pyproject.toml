[project]
name = "analise-risk"
version = "0.1.0"
description = "Sistema modular para análise de risco, simulação de performance de carteiras e visualização avançada de ativos financeiros."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "loguru>=0.7.3",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "plotly>=6.8.0",
    "yfinance>=1.4.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
